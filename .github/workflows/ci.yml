name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-check
          test -z "$(git status --porcelain drizzle/)" || (echo "Schema changed without a migration. Run npm run db:generate." && exit 1)
        env:
          DATABASE_URL: postgres://unused
