name: Persuna Desktop

# Builds Persuna Desktop for macOS (Intel and Apple silicon) and Windows
# (x64 and Arm). On pull requests that touch desktop/, it only checks the
# builds. Pushing a tag like desktop-v0.2.0 publishes them as a GitHub
# Release, which the app's "Get the desktop app" link points to.
#
# Signing turns on by itself when these repository secrets exist:
#   macOS:   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD (Developer ID Application),
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
#   Windows: WIN_CERT_PFX_BASE64, WIN_CERT_PASSWORD (code signing certificate)
# Without them the builds are unsigned.

on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --x64 --arm64
          - os: windows-latest
            target: --win --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: The tag matches the app version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: test "desktop-v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      # Certificate settings are passed on only when they exist: an empty
      # CSC_LINK makes the build look for a file named "".
      - name: Signing settings
        shell: bash
        env:
          CERT: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || secrets.WIN_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || secrets.WIN_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ]; then
            echo "::add-mask::$CERT_PASSWORD"
            { echo "CSC_LINK=$CERT"; echo "CSC_KEY_PASSWORD=$CERT_PASSWORD"; } >> "$GITHUB_ENV"
            echo "SIGN_ARGS=" >> "$GITHUB_ENV"
          else
            if [ "$RUNNER_OS" = macOS ]; then
              # Without a Developer ID, sign ad hoc (Apple silicon refuses unsigned code), and
              # without the hardened runtime: its library validation needs a Team ID, which an
              # ad hoc signature doesn't have, so the app would crash at launch.
              echo "SIGN_ARGS=-c.mac.identity=- -c.mac.hardenedRuntime=false" >> "$GITHUB_ENV"
            else
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            fi
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            { echo "APPLE_ID=$APPLE_ID"; echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"; echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"
          fi
      # Persuna's on-device screen reader (Swift, both Mac chips in one file).
      - name: Build the screen reader
        if: runner.os == 'macOS'
        run: npm run build:eyes
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never ${{ env.SIGN_ARGS }}
        env:
          # Sign pull-request builds too, so their test copies behave like releases.
          # Secrets never reach pull requests from forks, so this exposes nothing.
          CSC_FOR_PULL_REQUEST: true
      - name: Check the Mac apps are signed and actually start
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac*/Persuna.app; do
            echo "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "Authority|Signature|flags"
          done
          # A valid signature isn't enough: start the Apple silicon app (this runner's chip)
          # far enough to load Electron, which fails if macOS refuses its libraries.
          ELECTRON_RUN_AS_NODE=1 "dist/mac-arm64/Persuna.app/Contents/MacOS/Persuna" \
            -e 'console.log("Persuna starts: Electron", process.versions.electron)'
          # Start Persuna itself (not just Electron) and let its launch work run: a
          # crash at startup fails the build instead of reaching people.
          PERSUNA_SMOKE_TEST=1 "dist/mac-arm64/Persuna.app/Contents/MacOS/Persuna"
          # The screen reader is bundled and runs (it reports whether it's allowed to read).
          "dist/mac-arm64/Persuna.app/Contents/Resources/bin/persuna-eyes" trusted
          # The talk-key listener is a native module: it must load from the packaged app.
          ELECTRON_RUN_AS_NODE=1 "dist/mac-arm64/Persuna.app/Contents/MacOS/Persuna" \
            -e 'require(process.argv[1] + "/node_modules/uiohook-napi"); console.log("Talk key listener loads")' \
            "$PWD/dist/mac-arm64/Persuna.app/Contents/Resources/app.asar"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            ELECTRON_RUN_AS_NODE=1 arch -x86_64 "dist/mac/Persuna.app/Contents/MacOS/Persuna" \
              -e 'console.log("Intel build starts: Electron", process.versions.electron)'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: persuna-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Persuna, your AI assistant, over your whole screen.

          **Mac:** pick `mac-arm64` for Apple silicon (M1 and later) or `mac-x64` for Intel. Open the `.dmg` and drag Persuna to Applications. The first time, macOS can't check it (it isn't signed with an Apple certificate yet): open System Settings → Privacy & Security and click **Open Anyway**.
          **Windows:** run the `.exe` (`x64` for most PCs, `arm64` for Arm laptops).

          The first time Persuna watches, macOS asks for Screen Recording permission. Persuna only watches while you have watching turned on.
          NOTES
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Persuna Desktop ${GITHUB_REF_NAME#desktop-v}" --notes-file notes.md
